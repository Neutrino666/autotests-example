buildscript {
    ext {
        junitVersion = '5.13.4'
        allureVersion = '2.25.0'
        lombokVersion = '1.18.28'
        spotbugsVersion = '4.9.8'
        selenideVersion = '7.10.1'
    }
}

plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
    id 'io.qameta.allure-adapter' version '2.11.2'
    id 'ru.iopump.qa.allure' version '0.1.2'
}

group 'amurskiy.a.org'
version '1.0'

repositories {
    mavenCentral()
}

allure {
    version.set("${allureVersion}")
    adapter {
        aspectjVersion.set("1.9.22")
        aspectjWeaver.set(true)
    }
}

repositories {
    mavenCentral()
}

allureServer {
    relativeResultDir = 'build/allure-results'
    allureServerUrl = 'http://127.0.0.1:8081'

    requestToGeneration = { uuid ->
        """{"reportSpec": {
                "path": [ "Amurskiy-A" ],
                "executorInfo": {
                    "buildName": "Amurskiy-A",
                    "buildUrl": "Amurskiy-A_autotests",
                    "reportName": "Amurskiy-A_autotests"
                }
            },
            "results": [ "$uuid" ],
            "deleteResults": true
        }"""
    }
}

tasks.getByName('allureArchive') {
    mustRunAfter "test"
}
tasks.getByName('test') {

// finalizedBy "allureServerGenerate"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    // JUnit
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    // Allure
    testImplementation("io.qameta.allure:allure-selenide:${allureVersion}") {
        exclude group: 'com.codeborne'
    }
    testImplementation "io.qameta.allure:allure-assertj:${allureVersion}"
    testImplementation "io.qameta.allure:allure-rest-assured:${allureVersion}"
    // WEB
    testImplementation "com.codeborne:selenide:${selenideVersion}"
    // Annotation
    testImplementation "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "com.github.spotbugs:spotbugs-annotations:${spotbugsVersion}"
    testAnnotationProcessor "com.github.spotbugs:spotbugs-annotations:${spotbugsVersion}"

    // Rest assured
    testImplementation 'io.rest-assured:rest-assured:5.4.0'

    // JSON
    testImplementation 'org.json:json:20231013'

    // Assertions
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
}